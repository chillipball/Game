<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Waistband -->
  <rect x="20" y="6" width="40" height="12" rx="5" fill="#F59E0B"/>
  <!-- Skirt flare -->
  <path d="M20,17 C15,26 6,48 4,72 L76,72 C74,48 65,26 60,17 Z"
        fill="#FBBF24"/>
  <!-- Ruffle layer 1 -->
  <path d="M5,55 Q20,48 40,54 Q60,48 75,55 L76,62
           Q60,56 40,62 Q20,56 4,62 Z"
        fill="#FCD34D"/>
  <!-- Ruffle layer 2 -->
  <path d="M4,64 Q22,58 40,64 Q58,58 76,64 L76,72
           Q58,66 40,72 Q22,66 4,72 Z"
        fill="#FDE68A"/>
  <!-- Bow left -->
  <ellipse cx="34" cy="12" rx="8" ry="5" fill="#F59E0B" transform="rotate(-20,34,12)"/>
  <!-- Bow right -->
  <ellipse cx="46" cy="12" rx="8" ry="5" fill="#F59E0B" transform="rotate(20,46,12)"/>
  <!-- Bow knot -->
  <circle cx="40" cy="12" r="4.5" fill="#D97706"/>
</svg>

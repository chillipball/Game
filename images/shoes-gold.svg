<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <!-- Left shoe (pointed toe) -->
  <path d="M2,34 C0,44 2,56 7,64 Q16,70 32,67 L34,38 L34,34 Z" fill="url(#g)"/>
  <!-- Left heel peg -->
  <rect x="4" y="58" width="7" height="16" rx="2.5" fill="#78350F"/>
  <!-- Left sparkles -->
  <circle cx="14" cy="40" r="4.5" fill="white" opacity="0.92"/>
  <circle cx="22" cy="34" r="3.5" fill="white" opacity="0.85"/>
  <circle cx="24" cy="52" r="3"   fill="white" opacity="0.8"/>
  <!-- Left shine arc -->
  <path d="M8,36 Q18,30 28,35" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right shoe -->
  <path d="M46,34 L46,38 L48,67 Q64,70 73,64 C78,56 80,44 78,34 Q66,30 60,32 Z" fill="url(#g)"/>
  <!-- Right heel peg -->
  <rect x="69" y="58" width="7" height="16" rx="2.5" fill="#78350F"/>
  <!-- Right sparkles -->
  <circle cx="54" cy="40" r="4.5" fill="white" opacity="0.92"/>
  <circle cx="62" cy="34" r="3.5" fill="white" opacity="0.85"/>
  <circle cx="60" cy="52" r="3"   fill="white" opacity="0.8"/>
  <!-- Right shine arc -->
  <path d="M50,36 Q60,30 72,35" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

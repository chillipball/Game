<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Crown band -->
  <rect x="6" y="48" width="68" height="24" rx="6" fill="url(#g)"/>
  <!-- Band highlight -->
  <rect x="8" y="49" width="64" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
  <!-- Left point -->
  <polygon points="6,48 18,18 30,48" fill="url(#g)"/>
  <!-- Centre point (tallest) -->
  <polygon points="26,48 40,6  54,48" fill="#FDE68A"/>
  <!-- Right point -->
  <polygon points="50,48 62,18 74,48" fill="url(#g)"/>
  <!-- Left gem -->
  <circle cx="18" cy="28" r="8" fill="#EF4444"/>
  <circle cx="16" cy="26" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Centre gem (big) -->
  <circle cx="40" cy="18" r="10" fill="#3B82F6"/>
  <circle cx="37" cy="15" r="4"  fill="rgba(255,255,255,0.7)"/>
  <!-- Right gem -->
  <circle cx="62" cy="28" r="8"  fill="#22C55E"/>
  <circle cx="60" cy="26" r="3"  fill="rgba(255,255,255,0.7)"/>
  <!-- Band diamonds -->
  <circle cx="28" cy="60" r="5.5" fill="#FCD34D"/>
  <circle cx="40" cy="64" r="5.5" fill="#FCD34D"/>
  <circle cx="52" cy="60" r="5.5" fill="#FCD34D"/>
</svg>

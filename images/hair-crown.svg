<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Crown band -->
  <rect x="10" y="48" width="60" height="20" rx="5" fill="#F59E0B"/>
  <!-- Left point -->
  <polygon points="10,48 20,18 30,48" fill="#F59E0B"/>
  <!-- Centre point (tallest) -->
  <polygon points="28,48 40,8  52,48" fill="#FBBF24"/>
  <!-- Right point -->
  <polygon points="50,48 60,18 70,48" fill="#F59E0B"/>
  <!-- Left gem -->
  <circle cx="20" cy="30" r="6" fill="#EF4444"/>
  <circle cx="18" cy="28" r="2" fill="rgba(255,255,255,0.6)"/>
  <!-- Centre gem -->
  <circle cx="40" cy="20" r="7" fill="#3B82F6"/>
  <circle cx="38" cy="18" r="2.5" fill="rgba(255,255,255,0.6)"/>
  <!-- Right gem -->
  <circle cx="60" cy="30" r="6" fill="#22C55E"/>
  <circle cx="58" cy="28" r="2" fill="rgba(255,255,255,0.6)"/>
  <!-- Band details -->
  <circle cx="28" cy="58" r="4" fill="#FCD34D"/>
  <circle cx="40" cy="58" r="4" fill="#FCD34D"/>
  <circle cx="52" cy="58" r="4" fill="#FCD34D"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
  </defs>
  <!-- Waistband -->
  <rect x="8" y="4" width="64" height="14" rx="5" fill="#6D28D9"/>
  <rect x="10" y="5" width="60" height="5" rx="3" fill="rgba(255,255,255,0.2)"/>
  <!-- Left leg -->
  <path d="M8,17 C7,38 7,60 8,78 L34,78 C35,60 35,38 34,17 Z" fill="url(#g)"/>
  <!-- Right leg -->
  <path d="M46,17 C45,38 45,60 46,78 L72,78 C73,60 73,38 72,17 Z" fill="url(#g)"/>
  <!-- Crotch -->
  <path d="M34,17 L40,28 L46,17 Z" fill="url(#g)"/>
  <!-- Seam lines -->
  <line x1="21" y1="17" x2="21" y2="78" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <line x1="59" y1="17" x2="59" y2="78" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  <!-- Pocket stitch -->
  <path d="M10,24 Q19,19 29,24" stroke="#C4B5FD" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cuffs -->
  <rect x="8"  y="68" width="26" height="12" rx="3" fill="#5B21B6"/>
  <rect x="46" y="68" width="26" height="12" rx="3" fill="#5B21B6"/>
  <rect x="8"  y="68" width="26" height="4"  rx="2" fill="rgba(255,255,255,0.18)"/>
  <rect x="46" y="68" width="26" height="4"  rx="2" fill="rgba(255,255,255,0.18)"/>
</svg>

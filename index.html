          <img src="images/hair-pigtails.svg" width="80" height="80" alt="" draggable="false">
        </div>
        <div class="wardrobe-item" data-item="hair-tiara" data-zone="hair"
             role="button" tabindex="0" aria-label="Equip silver tiara">
          <img src="images/hair-tiara.svg" width="80" height="80" alt="" draggable="false">
        </div>

      </div><!-- /wardrobe-items -->
    </div><!-- /wardrobe-panel -->

    <!-- Centre: Doll stage -->
    <div id="doll-area">
      <svg id="doll-svg" viewBox="0 0 200 480" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Fashion doll">

        <!--
          SVG render order (bottom → top):
          1. Arms
          2. Legs  (covered by zone-bottom)
          3. Feet  (covered by zone-shoes)
          4. zone-bottom
          5. zone-shoes
          6. Torso
          7. Neck
          8. zone-top
          9. Head + Hair
          10. zone-hair
          11. Face (always on top)
        -->

        <!-- 1. Arms -->
        <path d="M55,177 C42,202 36,252 37,282 L53,285
                 C54,258 56,210 64,184 Z" fill="#FBBF8C"/>
        <path d="M145,177 C136,184 146,258 147,285 L163,282
                 C164,252 158,202 145,177 Z" fill="#FBBF8C"/>
        <!-- Hands -->
        <ellipse cx="44" cy="290" rx="11" ry="9" fill="#FBBF8C"/>
        <ellipse cx="156" cy="290" rx="11" ry="9" fill="#FBBF8C"/>

        <!-- 2. Legs -->
        <path d="M71,286 C69,326 68,376 68,430 L84,430
                 C84,376 83,326 81,286 Z" fill="#FBBF8C"/>
        <path d="M119,286 C117,326 117,376 117,430 L133,430
                 C133,376 133,326 131,286 Z" fill="#FBBF8C"/>

        <!-- 3. Feet -->

        <path d="M116,428 C114,434 114,444 118,452 L136,452
                 C138,444 140,434 134,428 Z" fill="#FBBF8C"/>

        <g id="zone-bottom"></g>

        <!-- 5. zone-shoes (clothing: shoes) -->
        <g id="zone-shoes"></g>

        <!-- 6. Torso -->
        <path d="M58,172 C46,188 44,234 46,266 C48,280 62,290 74,292
                 L126,292 C138,290 152,280 154,266 C156,234 154,188 142,172
                 C128,163 100,159 100,159 C100,159 72,163 58,172 Z"
              fill="#FBBF8C"/>
        <!-- Belly button -->
        <ellipse cx="100" cy="272" rx="4" ry="2.5" fill="#E8A87C" opacity="0.6"/>

        <!-- 7. Neck -->
        <rect x="88" y="148" width="24" height="26" rx="7" fill="#FBBF8C"/>
        <!-- Neck shadow for dimension -->
        <ellipse cx="100" cy="172" rx="14" ry="5" fill="#E8A87C" opacity="0.5"/>

        <!-- 8. zone-top (clothing: tops / shirts) -->
        <g id="zone-top"></g>

        <!-- 9a. Head -->
        <ellipse cx="100" cy="84" rx="62" ry="68" fill="#FBBF8C"/>

        <!-- 9b. Hair (dark chocolate brown) -->
        <!-- Back volume -->
        <path d="M38,80 C36,44 56,12 100,10 C144,12 164,44 162,80
                 C166,56 162,26 142,14 C124,4 100,2 100,2
                 C100,2 76,4 58,14 C38,26 34,56 38,80 Z"
              fill="#3D2314"/>
        <!-- Side sweeps -->
        <path d="M38,76 C30,52 34,26 50,16 C36,32 34,58 42,84 Z" fill="#3D2314"/>
        <path d="M162,76 C170,84 166,32 150,16 C166,26 170,52 162,76 Z" fill="#3D2314"/>
        <!-- Forehead strands -->
        <path d="M72,20 Q82,28 76,40" stroke="#3D2314" stroke-width="5"
              fill="none" stroke-linecap="round"/>
        <path d="M100,14 Q104,26 100,36" stroke="#3D2314" stroke-width="5"
              fill="none" stroke-linecap="round"/>
        <path d="M128,20 Q118,28 124,40" stroke="#3D2314" stroke-width="5"
              fill="none" stroke-linecap="round"/>

        <!-- Hair highlights for depth -->
        <path d="M72,20 Q100,10 128,20 Q116,14 100,12 Q84,14 72,20 Z" fill="#6B3A2A" opacity="0.65"/>
        <path d="M38,80 C34,56 40,32 58,18" stroke="#6B3A2A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
        <path d="M162,80 C166,56 160,32 142,18" stroke="#6B3A2A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
        <!-- Hair gloss -->
        <ellipse cx="90" cy="28" rx="18" ry="8" fill="rgba(255,255,255,0.12)" transform="rotate(-10,90,28)"/>

        <!-- Cheeks blush -->
        <ellipse cx="66" cy="116" rx="14" ry="10" fill="#FFB3C6" opacity="0.45"/>
        <ellipse cx="134" cy="116" rx="14" ry="10" fill="#FFB3C6" opacity="0.45"/>

        <!-- 10. zone-hair (accessories: bow, crown) -->
        <g id="zone-hair"></g>

        <!-- 11. Face (always rendered last / on top) -->

        <!-- Eye-shadow (makeup target) -->
        <ellipse id="eye-left-shadow"  cx="76"  cy="94" rx="16" ry="10" fill="#C084FC"/>
        <ellipse id="eye-right-shadow" cx="124" cy="94" rx="16" ry="10" fill="#C084FC"/>

        <!-- Eye whites -->
        <ellipse cx="76"  cy="96" rx="17" ry="15" fill="white"/>
        <ellipse cx="124" cy="96" rx="17" ry="15" fill="white"/>

        <!-- Iris -->
        <ellipse cx="76"  cy="98" rx="10" ry="12" fill="#4F46E5"/>
        <ellipse cx="124" cy="98" rx="10" ry="12" fill="#4F46E5"/>

        <!-- Pupils -->
        <ellipse cx="76"  cy="100" rx="5.5" ry="6.5" fill="#0F0800"/>
        <ellipse cx="124" cy="100" rx="5.5" ry="6.5" fill="#0F0800"/>

        <!-- Eye highlights -->
        <circle cx="79"  cy="95" r="3"   fill="white"/>
        <circle cx="127" cy="95" r="3"   fill="white"/>
        <circle cx="73"  cy="103" r="1.5" fill="white"/>
        <circle cx="121" cy="103" r="1.5" fill="white"/>

        <!-- Blink lids (animated by CSS – scaleY toggles to cover eye whites) -->
        <ellipse id="lid-left"  cx="76"  cy="96" rx="17" ry="15" fill="#FBBF8C"/>
        <ellipse id="lid-right" cx="124" cy="96" rx="17" ry="15" fill="#FBBF8C"/>

        <!-- Top lashes – left eye -->
        <line x1="59"  y1="86"  x2="61"  y2="79"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="65"  y1="83"  x2="65"  y2="75"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="71"  y1="82"  x2="71"  y2="73"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="77"  y1="82"  x2="77"  y2="73"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="83"  y1="83"  x2="84"  y2="75"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="89"  y1="86"  x2="91"  y2="79"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Top lashes – right eye -->
        <line x1="141" y1="86"  x2="139" y2="79"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="135" y1="83"  x2="135" y2="75"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="129" y1="82"  x2="129" y2="73"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="123" y1="82"  x2="123" y2="73"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="117" y1="83"  x2="116" y2="75"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="111" y1="86"  x2="109" y2="79"  stroke="#0F0800" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M57,79 Q76,70 93,76" stroke="#3D2314" stroke-width="3.5"
              fill="none" stroke-linecap="round"/>
        <path d="M107,76 Q124,70 143,79" stroke="#3D2314" stroke-width="3.5"
              fill="none" stroke-linecap="round"/>

        <!-- Nose (subtle) -->
        <ellipse cx="96"  cy="120" rx="3" ry="2" fill="#E8A87C"/>
        <ellipse cx="104" cy="120" rx="3" ry="2" fill="#E8A87C"/>

        <!-- Lips (split into upper + lower so fill change looks natural) -->
        <path id="lips-upper"
              d="M84,130 Q92,124 100,126 Q108,124 116,130
                 Q108,134 100,133 Q92,134 84,130 Z"
              fill="#FF4D6D"/>
        <path id="lips-lower"
              d="M84,130 Q92,144 100,146 Q108,144 116,130
                 Q108,137 100,136 Q92,137 84,130 Z"
              fill="#FF4D6D"/>
        <!-- Lip cupid's bow highlight -->
        <ellipse cx="100" cy="127" rx="6" ry="2" fill="rgba(255,255,255,0.3)"/>
        <!-- Lower lip shine -->
        <ellipse cx="100" cy="139" rx="7" ry="2.5" fill="rgba(255,255,255,0.25)"/>

      </svg><!-- /doll-svg -->

      <!-- Snap indicator rings (shown when dragging near a zone) -->
      <div class="snap-ring" id="snap-ring-top"></div>
      <div class="snap-ring" id="snap-ring-bottom"></div>
      <div class="snap-ring" id="snap-ring-shoes"></div>
      <div class="snap-ring" id="snap-ring-hair"></div>

      <!-- Outfit vibe feedback label -->
      <div id="vibe-label" aria-live="polite" aria-atomic="true"></div>

    </div><!-- /doll-area -->

    <!-- Right: Makeup panel -->
    <div id="makeup-panel">
      <div class="panel-label">💄 Makeup</div>

      <div class="makeup-section">
        <div class="makeup-label">👄 Lips</div>
        <div class="swatches-row">
          <div class="swatch" role="button" tabindex="0" data-target="lips" data-colour="#FF4D6D" aria-label="Hot pink lips"></div>
          <div class="swatch" role="button" tabindex="0" data-target="lips" data-colour="#FF8FA3" aria-label="Blush pink lips"></div>
          <div class="swatch" role="button" tabindex="0" data-target="lips" data-colour="#C77DFF" aria-label="Purple lips"></div>
          <div class="swatch" role="button" tabindex="0" data-target="lips" data-colour="#FF9A3C" aria-label="Orange lips"></div>
          <div class="swatch" role="button" tabindex="0" data-target="lips" data-colour="#E91E8C" aria-label="Deep pink lips"></div>
        </div>
      </div>

      <div class="makeup-section">
        <div class="makeup-label">👁 Eyes</div>
        <div class="swatches-row">
          <div class="swatch" role="button" tabindex="0" data-target="eyeshadow" data-colour="#C084FC" aria-label="Purple eyeshadow"></div>
          <div class="swatch" role="button" tabindex="0" data-target="eyeshadow" data-colour="#60D5FA" aria-label="Blue eyeshadow"></div>
          <div class="swatch" role="button" tabindex="0" data-target="eyeshadow" data-colour="#84FAB0" aria-label="Green eyeshadow"></div>
          <div class="swatch" role="button" tabindex="0" data-target="eyeshadow" data-colour="#FFD166" aria-label="Gold eyeshadow"></div>
          <div class="swatch" role="button" tabindex="0" data-target="eyeshadow" data-colour="#FF6B9D" aria-label="Pink eyeshadow"></div>
        </div>
      </div>

      <div class="makeup-section">
        <div class="makeup-label">✨ Reset</div>
        <button id="reset-btn">Start Over</button>
      </div>
    </div><!-- /makeup-panel -->

  </div><!-- /game-area -->
</div><!-- /app -->

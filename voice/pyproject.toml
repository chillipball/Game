[project]
name = "jarvis-voice"
version = "0.1.0"
description = "Jarvis voice pipeline (Pipecat + OpenWakeWord + optional Deepgram/Cartesia)"
requires-python = ">=3.12"
dependencies = [
  "pipecat-ai[silero]>=0.0.47",
  "openwakeword>=0.6.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1",
  "websockets>=12.0",
]

[project.optional-dependencies]
deepgram = ["pipecat-ai[deepgram]>=0.0.47"]
cartesia = ["pipecat-ai[cartesia]>=0.0.47"]
